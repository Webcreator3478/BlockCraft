[package]
name = "shared"
version = "0.0.0"
edition = "2021"

[dependencies]
bevy_log = { version = "0.20", default-features=false }
bevy_ecs = { version = "0.20", default-features=false}
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0.210", features = ["derive"] }
bevy = { version = "0.20", default-features = false, features = ["serialize"] }
# bevy_shape 0.20 made the `bounding` module private, so `bevy_shape::bounding::Aabb3d` no longer
# compiles. This shim keeps that path working on top of the public `bevy_shape::Aabb3d`.
# To remove it: replace `bevy_shape::bounding::Aabb3d` with `bevy_shape::Aabb3d` in the sources,
# then point this dependency back to `bevy_shape = { version = "0.20", default-features = false }`.
bevy_shape = { path = "bevy_shape_compat", package = "bevy_shape_compat" }
rand = "0.8"
bevy_renet = "6.0"
bincode = "1.3.3"
lz4 = "1.28.1"
bevy_platform = "0.20"
noise = "0.9.0"
socket2 = "0.6"

[dev-dependencies]
ron = "0.6"

[features]
# Fixtures to build worlds in the tests of the crates that depend on this one.
test-helpers = []

[lints]
workspace = true
